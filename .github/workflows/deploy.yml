name: 自动部署 Mini-Agent 到阿里云

on:
  push:
    branches:
      - main
  workflow_dispatch:  # 支持在 GitHub 页面上随时手动点击“Run workflow”部署

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 检出 GitHub 仓库源码
      - name: 检出代码
        uses: actions/checkout@v4

      # 2. 安装 pnpm 与 Node.js 环境
      - name: 安装 pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      # 3. 前端依赖安装与打包
      - name: 构建前端
        run: |
          cd frontend
          pnpm install
          pnpm build

      # 4. 配置 Go 编译环境
      - name: 配置 Go 环境
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: backend/go.sum

      # 5. 跨平台交叉编译 Go 后端（Linux amd64）
      - name: 编译 Go 后端
        run: |
          cd backend
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o server main.go

      # 6. 将构建产物传输到阿里云服务器
      - name: 上传构建文件到服务器
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "frontend/dist/**,backend/server,backend/public/**,backend/.env_rename_me,backend/deploy-server.sh"
          target: "/www/wwwroot/mini-agent"
          strip_components: 0

      # 7. 登录服务器执行部署与启动
      - name: 重启后端服务
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: bash /www/wwwroot/mini-agent/backend/deploy-server.sh
